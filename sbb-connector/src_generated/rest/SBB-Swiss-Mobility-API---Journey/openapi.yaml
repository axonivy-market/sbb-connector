        description: "The tracestate extends traceparent with vendor-specific data\
          \ represented by a set of name/value pairs. Storing information in tracestate\
          \ is optional (see W3C Trace Context). "
        required: false
        schema:
          type: "string"
      - name: "stopBehavior"
        in: "query"
        description: "Influences what stops are to be returned in response (ORIGIN_DESTINATION_ONLY\
          \ returns no intermediate stops; REAL_BOARDING_ALIGHTING returns all stops\
          \ except virtual stops). Default value: ORIGIN_DESTINATION_ONLY "
        required: false
        schema:
          type: "string"
          enum:
          - "ORIGIN_DESTINATION_ONLY"
          - "REAL_BOARDING_ALIGHTING"
      - name: "embed"
        in: "query"
        description: "Influences whether referenced resources are returned in full\
          \ or as references only. Default value: ALL "
        required: false
        schema:
          maxItems: 1
          minItems: 0
          type: "array"
          items:
            type: "string"
            enum:
            - "ALL"
            - "PLACES"
            - "NONE"
