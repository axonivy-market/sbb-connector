openapi: "3.0.1"
info:
  title: "SBB Swiss Mobility API - Journey"
  contact:
    name: "SBB Digital Affiliates"
    url: "https://www.sbb.ch/api"
    email: "digitalsales@sbb.ch"
  license:
    name: "SBB Licensed"
    url: "https://data.sbb.ch/page/licence/"
  version: "1.1.4"
  description: "## SBB Swiss Mobility API\n\n<p>This API is one of the modules of\
    \ the SBB Swiss Mobility API suite (see the <a href=\"https://smapi-cookbooks.app.sbb.ch/cookbooks/smapi-overview/index.html\"\
    >SBB Swiss Mobility API Overview</a>). </p>\n<p>The <strong>SBB Swiss Mobility\
    \ API - Journey</strong> is a REST API that enables SBB partners to request for\
    \ <strong>places</strong> and <strong>trips</strong> for swiss public transportation\
    \ in the OSDM Version 3 standard. </p>\n<p>Before you request access to the API,\
    \ please get in contact with <strong>SBB Digital Affiliates</strong>. On the right\
    \ you can find the contact details. </p>\n<h3>The OSDM standard</h3>\n<p>OSDM\
    \ stands for “Open Sales and Distribution Model”. It aims at simplifying and improving\
    \ the search and booking of public transportation and to increase interoperability\
    \ between providers, distributors and retailers. Further details can be found\
    \ in the official OSDM documentation on osdm.io:</p>\n<ul>\n  <li>\n    <a href=\"\
    https://osdm.io\">OSDM Open Sales and Distribution Model</a>\n  </li>\n  <a></a>\n\
    \  <li>\n    <a href=\"https://github.com/UnionInternationalCheminsdeFer/OSDM\"\
    >OSDM Specification</a>\n  </li>\n  <li>\n    <a href=\"https://osdm.io/spec/getting-started/\"\
    >Getting Started with OSDM</a>\n  </li>\n</ul>"
servers:
- description: "External Endpoint"
  url: "https://smapi-osdm-journey.api.sbb.ch:443"
- description: "Sandbox"
  url: "https://smapi-osdm-journey-mock.app.sbb.ch"
tags:
- name: "Places"
  description: "resources to search for places "
- name: "Trips"
  description: "resources to search for trips "
- name: "Master Data"
  description: "resources to get master data "
paths:
  /v1/trips-collection:
    post:
      tags:
      - "Trips"
      summary: "returns a collection of trips for a given OJP trip request"
      description: "Returns trips for a given trip request based on the OJP specification. "
      operationId: "postTrips"
      parameters:
      - name: "Requestor"
        in: "header"
        description: "The requestor header contains detailed information about who\
          \ is calling the API. It can include information such as channel, organization,\
          \ sales unit or workstation id and be used to configure e.g. the fare range\
          \ provided to the caller. The content of the string is part of a bilateral\
          \ contract by the two parties and not standardized by OSDM. It is recommend\
          \ to encrypt the information transferred. "
        required: true
        schema:
          type: "string"
      - name: "Accept-Language"
        in: "header"
        description: "Describes the set of natural languages that are preferred for\
          \ localized text in the response to the request (see RFC2616-sec14.4). Supporting\
          \ English (en) is a must. "
        required: false
        schema:
          type: "string"
      - name: "traceparent"
        in: "header"
        description: "The traceparent header describes the position of the incoming\
          \ request in its trace graph in a portable, fixed-length format. Its design\
          \ focuses on fast parsing. Every tracing tool MUST properly set traceparent\
          \ even when it only relies on vendor-specific information in tracestate\
          \ (see W3C Trace Context). "
        required: false
        schema:
          type: "string"
      - name: "tracestate"
        in: "header"
        description: "The tracestate extends traceparent with vendor-specific data\
          \ represented by a set of name/value pairs. Storing information in tracestate\
          \ is optional (see W3C Trace Context). "
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripSearchCriteria"
      responses:
        "200":
          description: "trips found "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripCollectionResponse"
        "400":
          description: "Bad Request (400) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Unauthorized (401) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Forbidden (403) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "Not Found (404) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "406":
          description: "Not Acceptable (406) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: "Unsupported Media Type (415) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: "Internal Server Error (500) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: "Not Implemented (501) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "Service Unavailable (503) "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: "default error response "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - oauth2-azure-ad:
        - "api://233a2404-020e-4cc8-9eed-ebe491087969/.default"
