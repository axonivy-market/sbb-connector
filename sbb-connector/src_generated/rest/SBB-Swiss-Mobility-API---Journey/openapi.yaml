  /v1/trips/{tripId}:
    get:
      tags:
      - "Trips"
      summary: "Returns a trip element representing a travel trip."
      description: "A trip consists of one or more legs for a given tripId. Depending\
        \ on the embed either references or full location definitions is returned. "
      operationId: "getTripsId"
      parameters:
      - name: "Requestor"
        in: "header"
        description: "The requestor header contains detailed information about who\
          \ is calling the API. It can include information such as channel, organization,\
          \ sales unit or workstation id and be used to configure e.g. the fare range\
          \ provided to the caller. The content of the string is part of a bilateral\
          \ contract by the two parties and not standardized by OSDM. It is recommend\
          \ to encrypt the information transferred. "
        required: true
        schema:
          type: "string"
      - name: "tripId"
        in: "path"
        description: "id of the trip to get. "
        required: true
        schema:
          type: "string"
      - name: "Accept-Language"
        in: "header"
