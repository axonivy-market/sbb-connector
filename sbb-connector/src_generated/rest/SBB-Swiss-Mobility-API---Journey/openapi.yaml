components:
  schemas:
    Address:
      required:
      - "id"
      type: "object"
      description: "A descriptive data associated with a place that can be used to\
        \ describe the unique geographical context of a place for the purposes of\
        \ identifying it. may be refined as either a road address, a postal address\
        \ or both. Provided by OJP. "
      allOf:
      - $ref: "#/components/schemas/Place"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "Name or description of address for use in passenger information. "
            example: "Oude Trambaan 7, 2265CA Leidschendam, Nederland"
          code:
            type: "string"
            description: "id of the address "
            example: "NL:1916200000022621"
          countryName:
            type: "string"
            description: "Country of the address. "
            example: "The Netherlands"
          countryCode:
            type: "string"
            description: "ISO country code (2 alpha), relative URNs with base urn:iso:std:iso:3166\
              \ are recommended "
            example: "DE"
          postCode:
            type: "string"
            description: "Postal code of the address. "
            example: "2265CA"
          city:
            type: "string"
            description: "City name "
            example: "Leidschendam"
          topographicPlaceName:
            type: "string"
            description: "TopographicPlace name of the address. If set it should at\
              \ least contain the city name. "
            example: "Leidschendam"
          street:
            type: "string"
            description: "Street name of the address. Can also contain the house number. "
            example: "Oude Trambaan"
          houseNumber:
            type: "string"
            description: "House number of the address. House number can either be\
              \ in this separate field, or can be contained in the street field. "
            example: "7"
          ref:
            $ref: "#/components/schemas/AddressRef"
    AddressRef:
      required:
      - "addressRef"
      type: "object"
      properties:
        addressRef:
          type: "string"
      description: "Reference to an Address. "
    Alight:
      required:
      - "serviceArrival"
      - "stopPlaceName"
      - "stopPlaceRef"
      type: "object"
      properties:
        stopPlaceRef:
          $ref: "#/components/schemas/StopPlaceRef"
        stopPlaceName:
          type: "string"
          example: "Luzern"
        plannedStopPointName:
          type: "string"
          description: "Name of the bay/quay/terminal where to board/alight from the\
            \ vehicle. According to planned timetable. "
          example: "3"
        estimatedStopPointName:
          type: "string"
          description: "Name of the bay/quay/terminal where to board the vehicle.\
            \ As to the latest realtime status. "
          example: "8"
        serviceArrival:
          $ref: "#/components/schemas/ServiceTime"
        status:
          $ref: "#/components/schemas/StopCallStatus"
      description: "Describes the situation at a stop or station at which the passenger\
        \ alights from a Leg of a trip including time-related information. Provided\
        \ by OJP. "
    Board:
      required:
      - "serviceDeparture"
      - "stopPlaceName"
      - "stopPlaceRef"
      type: "object"
      properties:
        stopPlaceRef:
          $ref: "#/components/schemas/StopPlaceRef"
        stopPlaceName:
          type: "string"
          example: "Luzern"
        plannedStopPointName:
          type: "string"
          description: "Name of the bay/quay/terminal where to board/alight from the\
            \ vehicle. According to planned timetable. "
          example: "3"
        estimatedStopPointName:
          type: "string"
          description: "Name of the bay/quay/terminal where to board the vehicle.\
            \ As to the latest realtime status. "
          example: "8"
        serviceDeparture:
          $ref: "#/components/schemas/ServiceTime"
        status:
          $ref: "#/components/schemas/StopCallStatus"
      description: "Describes the the situation at a stop or station at which the\
        \ passenger boards a Leg of a trip including time-related information. Provided\
        \ by OJP. "
    ContinuousLeg:
      required:
      - "end"
      - "service"
      - "start"
      type: "object"
      properties:
        start:
          oneOf:
          - $ref: "#/components/schemas/Place"
          - $ref: "#/components/schemas/Address"
          - $ref: "#/components/schemas/FareConnectionPoint"
          - $ref: "#/components/schemas/PointOfInterest"
          - $ref: "#/components/schemas/StopPlace"
        end:
          oneOf:
          - $ref: "#/components/schemas/Place"
          - $ref: "#/components/schemas/Address"
          - $ref: "#/components/schemas/FareConnectionPoint"
          - $ref: "#/components/schemas/PointOfInterest"
          - $ref: "#/components/schemas/StopPlace"
        service:
          $ref: "#/components/schemas/ContinuousService"
        timeWindowStart:
          type: "string"
          description: "Time at which window begins. "
          format: "date-time"
        timeWindowEnd:
          type: "string"
          description: "Time at which window ends. "
          format: "date-time"
        duration:
          type: "string"
          description: "Duration of this leg according to user preferences like walk\
            \ speed. "
          example: "1800S"
        situationFullRefs:
          type: "array"
          items:
            type: "string"
        co2Emission:
          $ref: "#/components/schemas/Quantity"
      description: "A leg of a journey that is not bound to a timetable. Provided\
        \ by OJP. "
    ContinuousService:
      required:
      - "destinationText"
      - "journeyRef"
      - "mode"
      - "operatingDayRef"
      - "originText"
      - "publishedServiceName"
      type: "object"
      properties:
        continuousMode:
          type: "string"
          description: "Types of modes that run at any time without a timetable. Provided\
            \ by OJP. "
        individualMode:
          type: "string"
          description: "Modes which an individual powers themselves (such as walk,\
            \ cycle). Provided by OJP. "
        operatingDayRef:
          type: "string"
          description: "Reference to an operating day. Provided by OJP. "
          example: "OperatingDay:12345"
        journeyRef:
          type: "string"
          description: "Reference to a journey. Provided by OJP. "
          example: "ServiceJourney:1"
        mode:
          type: "string"
          example: "Ask Stefan"
        publishedServiceName:
          type: "string"
          example: "Circle Line"
        originText:
          type: "string"
        destinationText:
          type: "string"
      description: "A vehicle movement on a continuous, non-timetabled service. Service\
        \ of this leg. May be 'walk' in most cases, but also cycling or taxi etc.\
        \ Provided by OJP. "
    DatedJourney:
      required:
      - "carriers"
      - "vehicleNumbers"
      type: "object"
      properties:
        operatingDayRef:
          type: "string"
          description: "Reference to an operating day. Provided by OJP. "
          example: "OperatingDay:12345"
        mode:
          $ref: "#/components/schemas/Mode"
        productCategory:
          $ref: "#/components/schemas/ProductCategory"
        publishedServiceName:
          type: "string"
          description: "Line name or service description as known to the public, f.e.\
            \ '512', 'S8' or 'Circle Line' or 'ICE 488'. "
          example: "S1"
        vehicleNumbers:
          maxItems: 2147483647
          minItems: 1
          type: "array"
          items:
            type: "string"
        lineNumbers:
          type: "array"
          items:
            type: "string"
        serviceStatus:
          $ref: "#/components/schemas/ServiceStatus"
        situationFullRefs:
          type: "array"
          items:
            type: "string"
        carriers:
          maxItems: 2147483647
          minItems: 1
          type: "array"
          items:
            $ref: "#/components/schemas/NamedCompany"
        attributes:
          type: "array"
          items:
            $ref: "#/components/schemas/GeneralAttribute"
      description: "Vehicle journey that runs at a specific date. Provided by OJP. "
    FareConnectionPoint:
      required:
      - "id"
      - "stationSets"
      type: "object"
      description: "Connection point connecting two fare regimes. The connection is\
        \ possible between stations of the two provided station sets. A legacy border\
        \ point code (id) might be provided as an additional code within the stations\
        \ (code list BORDER_POINT provided in URN). In case the connection point is\
        \ a real station this station is indicated. In case the connection point is\
        \ between stations for each side of the border real stations must be provided.\
        \ Multiple sets of station can be provided in the rare case that the connection\
        \ point connects more than two station (A-B and A-C). Multiple stations within\
        \ a set at one side of the border might be provided in case of changes (new\
        \ stations build near the border).  Providing the UIC code for the station\
        \ is mandatory. "
      allOf:
      - $ref: "#/components/schemas/Place"
      - type: "object"
        properties:
          name:
            type: "string"
          stationSets:
            maxItems: 2147483647
            minItems: 1
            type: "array"
            items:
              $ref: "#/components/schemas/StationSet"
          ref:
            $ref: "#/components/schemas/FareConnectionPointRef"
    FareConnectionPointRef:
      type: "object"
      properties:
        name:
          type: "string"
      description: "Reference to a Fare Connection Point. "
    GeneralAttribute:
      required:
      - "text"
      type: "object"
      properties:
        text:
          type: "string"
        code:
          type: "string"
        url:
          type: "string"
    GeoPosition:
      required:
      - "latitude"
      - "longitude"
      type: "object"
      properties:
        longitude:
          maximum: 180
          exclusiveMaximum: false
          minimum: -180
          exclusiveMinimum: false
          type: "number"
          description: "Longitude from Greenwich Meridian. -180 (West) to +180 (East).\
            \ Decimal degrees. eg 2.356. "
          format: "double"
          example: 8.54021
        latitude:
          maximum: 90
          exclusiveMaximum: false
          minimum: -90
          exclusiveMinimum: false
          type: "number"
          description: "Latitude from equator. -90 (South) to +90 (North). Decimal\
            \ degrees. e.g. 56.356. "
          format: "double"
          example: 47.37818
      description: "WGS84 coordinates position. Provided by OJP. "
    GeoPositionRef:
      required:
      - "latitude"
      - "longitude"
      type: "object"
      description: "Reference to a GeoPosition consisting of latitude and longitude. "
      allOf:
      - $ref: "#/components/schemas/PlaceRef"
      - type: "object"
        properties:
          latitude:
            maximum: 90
            exclusiveMaximum: false
            minimum: -90
            exclusiveMinimum: false
            type: "number"
            description: "Latitude from equator. -90 (South) to +90 (North). Decimal\
              \ degrees. e.g. 56.356. "
            format: "double"
            example: 47.37818
          longitude:
            maximum: 180
            exclusiveMaximum: false
            minimum: -180
            exclusiveMinimum: false
            type: "number"
            description: "Longitude from Greenwich Meridian. -180 (West) to +180 (East).\
              \ Decimal degrees. eg 2.356. "
            format: "double"
            example: 8.54021
    Intermediate:
      required:
      - "serviceArrival"
      - "serviceDeparture"
      - "stopPlaceName"
      - "stopPlaceRef"
      type: "object"
      properties:
        stopPlaceRef:
          $ref: "#/components/schemas/StopPlaceRef"
        stopPlaceName:
          type: "string"
          example: "Luzern"
        plannedStopPointName:
          type: "string"
          description: "Name of the bay/quay/terminal where to board/alight from the\
            \ vehicle. According to planned timetable. "
          example: "3"
        estimatedStopPointName:
          type: "string"
          description: "Name of the bay/quay/terminal where to board the vehicle.\
            \ As to the latest realtime status. "
          example: "8"
        serviceArrival:
          $ref: "#/components/schemas/ServiceTime"
        serviceDeparture:
          $ref: "#/components/schemas/ServiceTime"
        status:
          $ref: "#/components/schemas/StopCallStatus"
      description: "Describes the situation at a stop or station that lies between\
        \ the Board and Alight stop or station including time-related information.\
        \ Provided by OJP. "
    LegAttribute:
      required:
      - "text"
      type: "object"
      properties:
        text:
          type: "string"
          description: "Text of the attribute to be shown to the user. "
        code:
          type: "string"
          description: "Internal code of the attribute. Can be used for detection\
            \ of double occurrences. Refers to Service Facilities / Leg Attributes\
            \ from the Catalog of Code Lists "
        fromStopSeqNumber:
          minimum: 0
          type: "integer"
          description: "The attribute is valid from the stop point with this sequence\
            \ number within the leg. If missing it is valid from the beginning of\
            \ the leg. "
          format: "int32"
        toStopSeqNumber:
          minimum: 0
          type: "integer"
          description: "The attribute is valid to the stop point (inclusively) with\
            \ this sequence number within the leg. If missing it is valid to the end\
            \ of the leg. "
          format: "int32"
      description: "Attributes that are not valid on the whole service, but only on\
        \ section of a trip made on a single mode without interchange between boarding\
        \ and alighting. "
    Link:
      required:
      - "href"
      - "rel"
      type: "object"
      properties:
        rel:
          type: "string"
          description: "the 'rel' field in HATEOAS navigation. "
          example: "self"
        href:
          type: "string"
          description: "Allows to provide a value to the link, for example id of the\
            \ targeted resource or displayable representation for the link. "
          format: "uri"
        type:
          type: "string"
          description: "Hint to indicate the media type expected when dereferencing\
            \ the target resource. "
          example: "application/json"
        value:
          type: "string"
          description: "Allows to provide a value to the link, for example id of the\
            \ targeted resource or displayable representation for the link. "
      description: "The underlying system may provide links for pagination of links\
        \ pointing on further information (such as HTML download links, web sites\
        \ or extended APIs). Mechanism to add flexible extensions specific to an underlying\
        \ system. Implemented the JSON-HAL specification. "
    Mode:
      required:
      - "ptMode"
      type: "object"
      properties:
        ptMode:
          type: "string"
          description: "TAP-TSI/UIC contains a sensible subset of SIRI Transport Modes. "
        name:
          type: "string"
          description: "Name of the mode "
          example: "rail"
        shortName:
          type: "string"
          description: "Short name or acronym of the mode "
          example: "S"
        description:
          type: "string"
          description: "Additional text that further describes the mode "
      description: "A method of transportation such as bus, rail, etc. Provided by\
        \ OJP. "
    NamedCompany:
      required:
      - "ref"
      type: "object"
      properties:
        ref:
          type: "string"
          description: "Identifies a company. For rail, a RICS company code or compatible\
            \ ERA company code are used.  E.g.: 'urn:uic:rics:1185:000011' "
        name:
          type: "string"
          description: "Textual representation of the carrier to be displayed unless\
            \ the application is able to indicate the name by the carrier references. "
          example: "RhB"
      description: "Provides the reference and name of a company. "
    OperatingDays:
      required:
      - "from"
      - "pattern"
      - "until"
      type: "object"
      properties:
        from:
          type: "string"
          description: "Start date of period "
          format: "date-time"
        until:
          type: "string"
          description: "End date of period "
          format: "date-time"
        pattern:
          type: "string"
          description: "Bit pattern for operating days between start date and end\
            \ date. The length of the pattern is equal to the number of days from\
            \ start date to end date. A bit value of '1' indicates that an event actually\
            \ happens on the day that is represented by the bit position. "
      description: "Day of public transport operation of which the characteristics\
        \ are defined in a specific service calendar and which may last more than\
        \ 24 hours. Provided by OJP. "
    Place:
      required:
      - "id"
      - "objectType"
      type: "object"
      properties:
        id:
          type: "string"
          description: "id  defining the place. The code is provided as URN, relative\
            \ URNs are allowed with base path urn:uic:stn '0850000' "
          example: "urn:uic:stn:8500000"
        alternativeIds:
          type: "array"
          description: "For a place with ids in different reference systems, the alternative\
            \ ids can be returned.  The reference system is encoded in the string.\
            \ E.g.: 'urn:uic:std:80000', 'x_swe:stn:10000', 'ch:1:sloid:343434' "
          items:
            type: "string"
            description: "For a place with ids in different reference systems, the\
              \ alternative ids can be returned.  The reference system is encoded\
              \ in the string. E.g.: 'urn:uic:std:80000', 'x_swe:stn:10000', 'ch:1:sloid:343434' "
        geoPosition:
          $ref: "#/components/schemas/GeoPosition"
        _links:
          type: "array"
          description: " Java Property Name: 'links' "
          items:
            $ref: "#/components/schemas/Link"
        objectType:
          type: "string"
      description: "A geographic place of any type which may be specified as the origin\
        \ or destination of a trip. Provided by OJP. "
      discriminator:
        propertyName: "objectType"
    PlaceRef:
      required:
      - "objectType"
      type: "object"
      properties:
        objectType:
          type: "string"
      discriminator:
        propertyName: "objectType"
    PointOfInterest:
      required:
      - "code"
      - "id"
      - "name"
      type: "object"
      description: "A type of place to or through which passengers may wish to navigate\
        \ as part of their journey and which is modelled in detail by journey planners.\
        \ Provided by OJP. "
      allOf:
      - $ref: "#/components/schemas/Place"
      - type: "object"
        properties:
          name:
            type: "string"
            description: "Name or description of point of interest for use in passenger\
              \ information. "
            example: "Park Rozenrust"
          code:
            type: "string"
            description: "id of the Point of Interest. "
          ref:
            $ref: "#/components/schemas/PointOfInterestRef"
    PointOfInterestRef:
      required:
      - "pointOfInterestRef"
      type: "object"
      properties:
        pointOfInterestRef:
          type: "string"
      description: "Reference to a Point of Interest. Provided by OJP. "
    ProductCategory:
      required:
      - "name"
      - "productCategoryRef"
      - "shortName"
      type: "object"
      properties:
        name:
          type: "string"
          description: "Full name of this product category, e.g. 'TGV Lyria' in Switzerland\
            \ and France. UIC: Long name of Service Brand "
          example: "TGV Lyria"
        shortName:
          type: "string"
          description: "Short name or acronym of the product category, likely to be\
            \ published, e.g. 'TGV' UIC: Abbreviation of Service Brand "
          example: "TGV"
        productCategoryRef:
          type: "string"
          description: "Reference to a product category. Product categories should\
            \ be defined once and used uniformly in all channels (e.g. NeTEx, SIRI,\
            \ OJP). Provided by OJP. "
          example: "urn:uic:sbc:76"
      description: "Product category based on NeTEx/SIRI. A product category is a\
        \ classification for vehicle journeys to express some common properties of\
        \ journeys for marketing and fare products. Provided by OJP. "
    Quantity:
      required:
      - "unit"
      - "value"
      type: "object"
      properties:
        value:
          type: "number"
          format: "float"
        unit:
          type: "string"
          example: "kg"
      description: "Generic entity to model a quantity. "
    ServiceStatus:
      type: "object"
      properties:
        unplanned:
          type: "boolean"
          description: "Whether this trip is an additional one that has not been planned. "
        cancelled:
          type: "boolean"
          description: "Whether this trip is cancelled and will not be run. "
        deviation:
          type: "boolean"
          description: "Whether this trip deviates from the planned service pattern. "
        occupancy:
          type: "string"
          description: "Passenger load status on vehicle. If omitted, not known. Equivalent\
            \ to siri:OccupancyEnumeration which describes three values: 'full', 'seatingAvailable'\
            \ and 'standingAvailable'. "
      description: "Parameters which describe the current status of a dated vehicle\
        \ journey. Provided by OJP. "
    ServiceTime:
      required:
      - "timetabledTime"
      type: "object"
      properties:
        timetabledTime:
          type: "string"
          format: "date-time"
        estimatedTime:
          type: "string"
          format: "date-time"
        observedTime:
          type: "string"
          format: "date-time"
      description: "The time needs to be in Offset Time Format, i.e.  2023-12-03T10:15:30+01:00\
        \ as it is important the time zones are important  to show in the timetable.\
        \  Do not use the Coordinated Universal Time (UTC) format, i.e. 2023-12-03T10:15:30Z. "
    StationSet:
      required:
      - "stations"
      type: "object"
      properties:
        stations:
          maxItems: 2147483647
          minItems: 1
          type: "array"
          items:
            $ref: "#/components/schemas/StopPlaceRef"
    StopCallStatus:
      type: "object"
      properties:
        order:
          minimum: 0
          type: "integer"
          description: "Sequence number of this stop in the service pattern of the\
            \ journey. "
          format: "int32"
        requestStop:
          type: "boolean"
          description: "The vehicle journey calls at this stop only on demand. "
        unplannedStop:
          type: "boolean"
          description: "This stop has not been planned by the planning department. "
        notServicedStop:
          type: "boolean"
          description: "The vehicle will not call at this stop despite earlier planning. "
        noBoardingAtStop:
          type: "boolean"
          description: "Boarding will not be allowed at this stop of this journey. "
        noAlightingAtStop:
          type: "boolean"
          description: "Alighting will not be allowed at this stop of this journey. "
      description: "Status properties for the vehicle call at this stop. Provided\
        \ by OJP. "
    StopPlace:
      required:
      - "id"
      - "name"
      type: "object"
      description: "A place extended by accessibility limitation properties and some\
        \ attributes of the associated equipment, comprising one or more places where\
        \ vehicles may stop and where passengers may board or leave vehicles or prepare\
        \ their trip, and which will usually have one or more wellknown names. Provided\
        \ by OJP. "
      allOf:
      - $ref: "#/components/schemas/Place"
      - type: "object"
        properties:
          ref:
            $ref: "#/components/schemas/StopPlaceRef"
          name:
            type: "string"
            description: "Name of this stop place for use in passenger information. "
            example: "Zürich HB"
    StopPlaceRef:
      required:
      - "stopPlaceRef"
      type: "object"
      properties:
        stopPlaceRef:
          type: "string"
          example: "urn:uic:stn:8503000"
      description: "Reference to a Stop Place using URNs to define code. For UIC see\
        \ UIC MERITS/TAP-TSI station codes. Provided by OJP. "
    TimedLeg:
      required:
      - "end"
      - "service"
      - "start"
      type: "object"
      properties:
        start:
          $ref: "#/components/schemas/Board"
        intermediates:
          type: "array"
          items:
            $ref: "#/components/schemas/Intermediate"
        end:
          $ref: "#/components/schemas/Alight"
        service:
          $ref: "#/components/schemas/DatedJourney"
        operatingDays:
          $ref: "#/components/schemas/OperatingDays"
        operatingDaysDescription:
          type: "string"
          description: "Textual description of the operation days, e.g. 'Monday to\
            \ Friday' or 'not on holidays'. "
        duration:
          type: "string"
        co2Emission:
          $ref: "#/components/schemas/Quantity"
        attributes:
          type: "array"
          items:
            $ref: "#/components/schemas/LegAttribute"
      description: "A leg which is bound to a timetabled schedule. Corresponds to\
        \ a ride. Provided by OJP. "
    TransferLeg:
      required:
      - "end"
      - "start"
      type: "object"
      properties:
        continuousMode:
          type: "string"
          description: "Types of modes that run at any time without a timetable. Provided\
            \ by OJP. "
        transferMode:
          type: "string"
          description: "Modes dedicated to perform transfers. Provided by OJP. "
        start:
          oneOf:
          - $ref: "#/components/schemas/PlaceRef"
          - $ref: "#/components/schemas/AddressRef"
          - $ref: "#/components/schemas/FareConnectionPointRef"
          - $ref: "#/components/schemas/GeoPositionRef"
          - $ref: "#/components/schemas/PointOfInterestRef"
          - $ref: "#/components/schemas/StopPlaceRef"
        end:
          oneOf:
          - $ref: "#/components/schemas/PlaceRef"
          - $ref: "#/components/schemas/AddressRef"
          - $ref: "#/components/schemas/FareConnectionPointRef"
          - $ref: "#/components/schemas/GeoPositionRef"
          - $ref: "#/components/schemas/PointOfInterestRef"
          - $ref: "#/components/schemas/StopPlaceRef"
        timeWindowStart:
          type: "string"
          description: "Time at which window begins. "
          format: "date-time"
        timeWindowEnd:
          type: "string"
          description: "Time at which window ends. "
          format: "date-time"
        duration:
          type: "string"
          description: "Overall duration of this interchange. "
          example: "PT20M"
        situationFullRefs:
          type: "array"
          items:
            type: "string"
        co2Emission:
          $ref: "#/components/schemas/Quantity"
      description: "A leg which links other legs of a trip where a transfer between\
        \ different places is required. Provided by OJP. "
    Trip:
      required:
      - "direction"
      - "duration"
      - "endTime"
      - "id"
      - "legs"
      - "startTime"
      - "transfers"
      type: "object"
      properties:
        id:
          type: "string"
          description: "Id of this trip for referencing purposes. Unique within a\
            \ trip. "
        externalRef:
          type: "string"
          description: "External reference of this trip for referencing purposes. "
        summary:
          type: "string"
          description: "A human-readable description of the trip. "
        duration:
          type: "string"
          description: "Overall duration of the trip "
          example: "PT20M"
        direction:
          type: "string"
          enum:
          - "OUT_BOUND"
          - "IN_BOUND"
        origin:
          oneOf:
          - $ref: "#/components/schemas/PlaceRef"
          - $ref: "#/components/schemas/AddressRef"
          - $ref: "#/components/schemas/FareConnectionPointRef"
          - $ref: "#/components/schemas/GeoPositionRef"
          - $ref: "#/components/schemas/PointOfInterestRef"
          - $ref: "#/components/schemas/StopPlaceRef"
        destination:
          oneOf:
          - $ref: "#/components/schemas/PlaceRef"
          - $ref: "#/components/schemas/AddressRef"
          - $ref: "#/components/schemas/FareConnectionPointRef"
          - $ref: "#/components/schemas/GeoPositionRef"
          - $ref: "#/components/schemas/PointOfInterestRef"
          - $ref: "#/components/schemas/StopPlaceRef"
        startTime:
          type: "string"
          description: "Departure time at origin. "
          format: "date-time"
        endTime:
          type: "string"
          description: "Arrival time at destination "
          format: "date-time"
        transfers:
          minimum: 0
          type: "integer"
          description: "Number of interchanges "
          format: "int32"
        distance:
          minimum: 0
          type: "integer"
